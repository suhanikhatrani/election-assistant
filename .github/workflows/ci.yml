name: CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test-backend:
    name: Backend Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: election-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: election-backend/package-lock.json
      - run: npm ci
      - name: Syntax check
        run: node --check server.js
      - name: Verify critical files exist
        run: |
          test -f server.js && echo "server.js OK"
          test -f middleware/validate.js && echo "validate.js OK"
          test -f middleware/paginate.js && echo "paginate.js OK"
          test -f .env.example && echo ".env.example OK"
          test ! -f .env && echo ".env correctly absent"

  test-frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: election-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: election-frontend/package-lock.json
      - run: npm ci
      - name: Build production bundle
        run: npm run build
        env:
          VITE_API_URL: https://placeholder.onrender.com/api
      - name: Verify dist exists
        run: test -d dist && echo "Build OK"
